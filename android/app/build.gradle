plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nfsmw.android'
    compileSdk 35


    def releaseKeystore = System.getenv("NFSMW_KEYSTORE")

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("NFSMW_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NFSMW_KEY_ALIAS") ?: "nfsmw"
                keyPassword System.getenv("NFSMW_KEY_PASSWORD") ?: System.getenv("NFSMW_KEYSTORE_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId 'io.github.nfsmwrecomp'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv("NFSMW_VERSION_CODE") ?: "100").toInteger()
        versionName System.getenv("NFSMW_VERSION_NAME") ?: "1.0.0-mali"
        ndk {
            abiFilters 'arm64-v8a'
        }
        // externalNativeBuild {
        //     cmake {
        //         cppFlags '-std=c++23'
        //         arguments '-DANDROID_STL=c++_shared'
        //     }
        // }
    }

    packaging { jniLibs { useLegacyPackaging true } }

    buildTypes {
        release {
            minifyEnabled false
            // One key for every release: Android only installs an update over the same signature, and
            // a new one means uninstalling, which wipes the converted game data and the texture cache.
            // Without the keystore (local shell builds) it falls back to the debug key.
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            // AGP builds release natives as RelWithDebInfo (-O2 -g); the game wants the SDK's Release
            // flags (-O3, no asserts) and ThinLTO (src/main/cpp/CMakeLists.txt).
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    // externalNativeBuild {
    //     cmake {
    //         path file('src/main/cpp/CMakeLists.txt')
    //         version '3.30.5'
    //     }
    // }

    ndkVersion '28.2.13676358'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
