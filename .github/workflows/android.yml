name: Android shell (arm64)

# Public CI builds the launcher shell only: no engine libraries, no translated game code and no
# artifacts. The runnable APK needs the game's own executable, so it is built in the private
# builder and published from there as a release. Keeping this workflow asset-free means nothing
# downloadable here contains anything but our own source.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Build Architecture Checkpoints
        run: |
          python3 tools/check_app_spec.py

      - name: Build launcher shell
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
