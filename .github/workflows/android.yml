name: Android ARM64 (Malicomp)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Licenses and Install SDK/NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Fetch ReXGlue Third-Party Dependencies
        run: python3 tools/fetch_thirdparty.py

      - name: Build ARM64 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: malicomp-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
