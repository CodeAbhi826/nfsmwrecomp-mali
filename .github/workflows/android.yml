name: Android ARM64 (Malicomp)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Build Architecture Checkpoints
        run: |
          python3 tools/check_app_spec.py

      - name: Fetch Precompiled Native Core Libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p build_output/base_apk
          gh release download v0.5.1 --repo victorgbd/NFSMW-Recompiled-Mobile --pattern "*.apk" --dir build_output/base_apk
          unzip -j build_output/base_apk/*.apk "lib/arm64-v8a/*" -d android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Patch Mali native-renderer gate (runtimeDescriptorArray check)
        run: |
          python3 tools/patch_mali_native_gate.py android/app/src/main/jniLibs/arm64-v8a --require

      - name: Build ARM64 Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: malicomp-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
